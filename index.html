<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IQ Tracker — Circuit Delivery</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.19.0/iconfont/tabler-icons.min.css">
<style>
:root{--bg:#1C2333;--bg2:#252E44;--bg3:#1E2840;--bg4:#1A2236;--brd:#2A3550;--brd2:#3A4560;--tx:#E8EAF0;--tx2:#C8D0E0;--tx3:#8A9BB5;--tx4:#607080;--blue:#185FA5;--blue2:#152440;--blue3:#4A7AB5;--green:#2D5A1B;--green2:#1A3A10;--green3:#5A9A38;--red:#7A2020;--red2:#3A1A1A;--red3:#D06060;--amb:#7A4A10;--amb2:#3A2A10;--amb3:#D08840;--pur:#2A1A5A;--pur3:#9090E0;--r:8px;--r2:12px;--r3:14px}
.light{--bg:#F0F2F7;--bg2:#FFFFFF;--bg3:#F5F7FA;--bg4:#E8EBF2;--brd:#D0D5E0;--brd2:#B0B8CC;--tx:#1A2233;--tx2:#2A3550;--tx3:#5A6A85;--tx4:#8A9AB5;--blue:#1A5FA5;--blue2:#E6F1FB;--blue3:#3A7FD5;--green:#2A6010;--green2:#E8F5E0;--green3:#4A9A28;--red:#8A2020;--red2:#FBE8E8;--red3:#C04040;--amb:#7A4A08;--amb2:#FBF0E0;--amb3:#C07820;--pur:#2A1A8A;--pur3:#6060D0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;font-size:var(--base-font,13px);min-height:100vh}
input,select,textarea,button{font-family:inherit;font-size:12px}
button{cursor:pointer!important}
a{color:var(--blue3);text-decoration:underline}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}
.app{padding:.875rem 1.5rem 3.5rem;max-width:1400px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:6px}
.hdr-l{display:flex;align-items:center;gap:9px}
.hico{width:34px;height:34px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#BFD8F5;font-size:17px;flex-shrink:0}
.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);font-weight:500}
.htitle{font-size:16px;font-weight:600;color:var(--tx)}
.hdr-r{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:var(--r);border:1px solid var(--brd2);background:var(--bg2);color:var(--tx2);font-size:11px;font-weight:500;cursor:pointer!important;white-space:nowrap;transition:opacity .12s}
.btn:hover{opacity:.82}
.btn-blue{background:var(--blue);color:#E6F1FB;border-color:var(--blue3)}
.btn-green{background:var(--green);color:#C6E8B0;border-color:var(--green3)}
.btn-red{color:var(--red3);border-color:rgba(180,60,60,.4);background:transparent}
.btn-red:hover{background:var(--red2)}
.btn-amb{background:var(--amb);color:#F5D080;border-color:var(--amb3)}
.btn-pur{background:var(--pur);color:var(--pur3);border-color:var(--pur3)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--tx3)}
.btn-ghost:hover{background:var(--bg3);color:var(--tx)}
.btn-xs{padding:2px 6px;font-size:10px;border-radius:5px}
.btn-sm{padding:4px 8px;font-size:11px}
.btn-dis{opacity:.3;pointer-events:none}
.ico-btn{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--tx3);cursor:pointer!important;font-size:13px;flex-shrink:0}
.ico-btn:hover{background:var(--bg3);color:var(--tx);border-color:var(--brd)}
.nav{display:flex;gap:3px;margin-bottom:1rem;background:var(--bg4);padding:3px;border-radius:10px;width:fit-content;border:1px solid var(--brd);overflow-x:auto}
.ntab{padding:5px 13px;border-radius:7px;font-size:11px;font-weight:500;color:var(--tx3);cursor:pointer!important;border:none;background:transparent;display:flex;align-items:center;gap:4px;white-space:nowrap}
.ntab.on{background:var(--bg2);color:var(--tx);border:1px solid var(--brd)}
.nbadge{font-size:10px;background:var(--bg4);border:1px solid var(--brd);border-radius:20px;padding:1px 5px;color:var(--tx3)}
.metrics{display:flex;gap:6px;margin-bottom:.75rem;flex-wrap:wrap}
.mc{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:7px 12px;flex:1;min-width:120px;max-width:200px}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.mc-ico{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px}
.mc-lbl{font-size:9px;color:var(--tx3);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.mc-val{font-size:18px;font-weight:700;color:var(--tx);line-height:1}
.mc-sub{font-size:9px;color:var(--tx3);margin-top:1px}
.alert{border-radius:var(--r);padding:8px 11px;display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:7px;border:1px solid}
.a-risk{background:var(--amb2);border-color:var(--amb3);color:#F5C060}
.a-sfp{background:var(--blue2);border-color:var(--blue3);color:#80B8E8}
.a-cap{background:var(--red2);border-color:var(--red3);color:var(--red3)}
.a-ico{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0}
.d-blue{background:var(--blue3)}.d-red{background:var(--red3)}.d-amb{background:var(--amb3)}.d-green{background:var(--green3)}
.spl{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:500;padding:3px 8px;border-radius:20px}
.sp-p{background:var(--blue2);color:#80B8E8}.sp-r{background:var(--red2);color:var(--red3)}.sp-o{background:var(--amb2);color:var(--amb3)}.sp-l{background:var(--green2);color:#80C060}.sp-d{background:var(--red2);color:var(--red3)}
.tbadge{font-size:10px;font-weight:500;padding:2px 6px;border-radius:5px;background:var(--bg4);color:var(--tx3);border:1px solid var(--brd)}
.prot-y{font-size:10px;padding:2px 6px;border-radius:5px;background:var(--green2);color:#60C090;border:1px solid var(--green3)}
.prot-n{font-size:10px;padding:2px 6px;border-radius:5px;background:var(--bg4);color:var(--tx3);border:1px solid var(--brd)}
.eng-chip{font-size:10px;padding:2px 6px;border-radius:5px;background:var(--pur);color:var(--pur3);border:1px solid var(--pur3);display:inline-flex;align-items:center;gap:3px}
.urg-btn{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid;cursor:pointer!important;display:inline-flex;align-items:center;gap:3px}
.urg-on{background:#4A0A0A;color:#FF6060;border-color:#8A2020}
.urg-warn{background:#4A3500;color:#FFD060;border-color:#8A6000}
.urg-off{background:var(--green2);color:#80C060;border-color:var(--green3)}
.cbwrap{display:flex;align-items:center;justify-content:center;width:24px;flex-shrink:0;cursor:pointer!important}
.chkbox{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--brd2);background:var(--bg3);display:flex;align-items:center;justify-content:center}
.chkbox.on{background:var(--blue);border-color:var(--blue3)}
.bulk-bar{background:var(--blue2);border:1px solid var(--blue3);border-radius:var(--r);padding:7px 12px;display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:11px;color:#80B8E8}
.ccard{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r3);margin-bottom:7px;overflow:hidden;transition:border-color .15s}
.ccard:hover{border-color:var(--brd2)}
.ccard.open{border-color:var(--blue3)}
.ccard.urg{border-left:3px solid var(--red3)}
.ccard.sel-c{border-color:var(--blue3);background:var(--blue2)}
.ccard.dg-top{border-top:3px solid var(--blue3)!important}
.ccard.dg-bot{border-bottom:3px solid var(--blue3)!important}
.ccard.dragging{opacity:.35}
.ccard-top{padding:9px 13px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ccard-name{font-size:14px;font-weight:600;color:var(--tx);cursor:pointer!important;flex:1;min-width:100px}
.ccard-tr{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-left:auto}
.ccard-meta{padding:4px 13px 9px 44px;display:flex;align-items:center;gap:5px;cursor:pointer!important;flex-wrap:wrap}
.cid-chip{font-size:10px;font-family:monospace;color:var(--tx3);background:var(--bg4);border:1px solid var(--brd);border-radius:4px;padding:1px 5px}
.ccard-ep{font-size:11px;color:var(--tx3)}
.cad-chip{display:flex;flex-direction:column;align-items:flex-end;margin-left:auto;flex-shrink:0}
.cad-l{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);font-weight:500}
.cad-v{font-size:11px;font-weight:600;color:var(--tx)}
.ccard-body{border-top:1px solid var(--brd);padding:13px}
.gdiv{display:flex;align-items:center;gap:6px;padding:9px 13px;margin:4px 0;background:var(--blue2);border:1px solid var(--blue3);border-radius:var(--r3);cursor:grab}
.gdiv.dragging{opacity:.35}
.gdiv.dg-top{border-top:3px solid var(--amb3)!important}
.gdiv.dg-bot{border-bottom:3px solid var(--amb3)!important}
.gdiv-inp{font-size:14px;font-weight:600;color:var(--blue3);background:transparent;border:none;border-bottom:1px dashed transparent;outline:none;flex:1;min-width:60px;cursor:text}
.gdiv-inp:focus{color:var(--tx);border-bottom-color:var(--blue3)}
.pipeline{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.pl-track{position:relative;height:32px;border-radius:16px;background:var(--bg4);border:1px solid var(--brd);overflow:hidden;cursor:pointer!important}
.pl-fill{height:100%;border-radius:16px;transition:width .4s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;min-width:32px}
.pl-fill-done{background:linear-gradient(90deg,var(--green2),var(--green3))}
.pl-fill-act{background:linear-gradient(90deg,var(--blue2),var(--blue3))}
.pl-fill-skip{background:linear-gradient(90deg,var(--amb2),var(--amb3))}
.pl-fill-pend{background:transparent;color:var(--tx4)}
.pl-markers{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.pl-mark{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.15)}
.pl-mark-lbl{position:absolute;top:50%;transform:translateY(-50%);font-size:9px;color:rgba(255,255,255,.45);pointer-events:none}
.pl-phase-lbl{font-size:9px;color:var(--tx3);font-weight:500;display:flex;align-items:center;gap:4px;padding:0 2px}
.pl-phase-lbl.pl-done{color:var(--green3)}
.pl-phase-lbl.pl-act{color:var(--blue3);font-weight:600}
.pl-phase-lbl.pl-skip{color:var(--amb3)}
.pl-row{display:flex;align-items:center;gap:8px}
.pl-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;border:1.5px solid;flex-shrink:0}
.pl-done-ico{border-color:var(--green3);background:var(--green2);color:#C6E8B0}
.pl-act-ico{border-color:var(--blue3);background:var(--blue2);color:#80B8E8}
.pl-skip-ico{border-color:var(--amb3);background:var(--amb2);color:var(--amb3)}
.pl-pend-ico{border-color:var(--brd2);background:var(--bg4);color:var(--tx4)}
.dtabs{display:flex;gap:2px;background:var(--bg4);border-radius:var(--r);padding:2px;margin-bottom:11px;overflow-x:auto;border:1px solid var(--brd)}
.dtab{flex:1;min-width:fit-content;padding:4px 7px;border-radius:5px;font-size:10px;font-weight:500;text-align:center;cursor:pointer!important;color:var(--tx3);white-space:nowrap;border:none;background:transparent}
.dtab.on{background:var(--bg2);color:var(--tx);border:1px solid var(--brd)}
.dtab.dt-done{color:var(--green3)}.dtab.dt-skip{color:var(--amb3);font-style:italic}
.itabs{display:flex;gap:2px;background:var(--bg4);border-radius:6px;padding:2px;margin-bottom:9px;border:1px solid var(--brd)}
.itab{flex:1;min-width:fit-content;padding:3px 7px;border-radius:5px;font-size:10px;font-weight:500;text-align:center;cursor:pointer!important;color:var(--tx3);white-space:nowrap;border:none;background:transparent}
.itab.on{background:var(--bg2);color:var(--tx);border:1px solid var(--brd)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}
.panel{background:var(--bg3);border:1px solid var(--brd);border-radius:var(--r);padding:11px}
.ptitle{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:5px}
.ptitle-inp{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);background:transparent;border:none;border-bottom:1px dashed transparent;outline:none;flex:1}
.ptitle-inp:focus{border-bottom-color:var(--blue3);color:var(--tx)}
.cl{display:flex;flex-direction:column;gap:6px}
.ci{display:flex;align-items:flex-start;gap:6px;padding:2px 0}
.ci.dg-ci{border-top:2px solid var(--blue3)}
.ci-chk{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--brd2);background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;cursor:pointer!important}
.ci-chk.on{background:var(--green2);border-color:var(--green3);color:#C6E8B0}
.ci-r{flex:1;min-width:0}
.ci-lw{display:flex;align-items:center;gap:4px}
.ci-li{font-size:12px;color:var(--tx2);background:transparent;border:none;border-bottom:1px dashed transparent;outline:none;flex:1;min-width:60px;line-height:1.4}
.ci-li:focus{border-bottom-color:var(--blue3);color:var(--tx)}
.ci-li.struck{color:var(--tx4);text-decoration:line-through}
.ci-date{font-size:10px;color:var(--green3);font-weight:500;margin-top:1px}
.ecd-row{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.ecd-d{font-size:11px;border:1px solid var(--brd);border-radius:5px;padding:2px 6px;background:var(--bg2);color:var(--tx2);width:130px}
.ecd-c{font-size:11px;border:1px solid var(--brd);border-radius:5px;padding:2px 6px;background:var(--bg2);color:var(--tx2);flex:1;min-width:100px}
.ecd-d:focus,.ecd-c:focus{outline:none;border-color:var(--blue3)}
.ci-note{font-size:11px;border:1px solid var(--brd);border-radius:4px;padding:2px 6px;background:var(--bg2);color:var(--tx2);width:100%;margin-top:3px}
.ci-note:focus{outline:none;border-color:var(--blue3)}
.note-links{margin-top:2px;display:flex;flex-direction:column;gap:2px}
.nlink{font-size:11px;display:flex;align-items:center;gap:3px}
.add-btn{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--tx4);cursor:pointer!important;padding:3px 0;border:none;background:transparent;margin-top:3px}
.add-btn:hover{color:var(--tx)}
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}
.fl{display:flex;align-items:center;gap:3px}
.fl-i{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);background:transparent;border:none;border-bottom:1px dashed transparent;outline:none;flex:1}
.fl-i:focus{border-bottom-color:var(--blue3)}
.fi{border:1px solid var(--brd);border-radius:6px;padding:5px 8px;font-size:11px;background:var(--bg2);color:var(--tx2);width:100%}
.fi:focus{outline:none;border-color:var(--blue3)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:3px}
.cb-box{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);padding:8px}
.cb-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);font-weight:600;margin-bottom:4px}
.ci2{width:100%;font-size:11px;border:1px solid var(--brd);border-radius:4px;padding:3px 5px;background:var(--bg3);color:var(--tx2);margin-bottom:3px}
.ci2:last-child{margin-bottom:0}
.ci2:focus{outline:none;border-color:var(--blue3)}
.na{width:100%;border:1px solid var(--brd);border-radius:6px;padding:6px 8px;font-size:11px;background:var(--bg2);color:var(--tx2);resize:vertical;min-height:50px}
.na:focus{outline:none;border-color:var(--blue3)}
.ph-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:11px;border-top:1px solid var(--brd);flex-wrap:wrap;gap:6px}
.ph-prog{font-size:11px;color:var(--tx3)}
.ph-prog strong{color:var(--tx)}
.skip-note{background:var(--amb2);border:1px solid var(--amb3);border-radius:var(--r);padding:6px 9px;font-size:11px;color:var(--amb3);display:flex;align-items:center;gap:6px}
.hist-list{display:flex;flex-direction:column;gap:5px;max-height:280px;overflow-y:auto}
.hist-item{display:flex;gap:8px;font-size:11px;padding:5px 7px;background:var(--bg2);border-radius:5px;border:1px solid var(--brd)}
.hist-ts{color:var(--tx4);white-space:nowrap;flex-shrink:0;font-size:10px;min-width:110px}
.mov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:1.5rem 1rem;overflow-y:auto}
.modal{background:var(--bg2);border-radius:var(--r3);border:1px solid var(--brd2);padding:1.25rem;width:600px;max-width:100%;margin:auto}
.modal-title{font-size:14px;font-weight:600;margin-bottom:3px;color:var(--tx)}
.modal-sub{font-size:11px;color:var(--tx3);margin-bottom:.875rem;line-height:1.5}
.modal-foot{display:flex;justify-content:flex-end;gap:6px;margin-top:.875rem;padding-top:.875rem;border-top:1px solid var(--brd)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
.flbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);display:block;margin-bottom:3px}
.finp{border:1px solid var(--brd2);border-radius:6px;padding:6px 9px;font-size:12px;background:var(--bg3);color:var(--tx2);width:100%}
.finp:focus{outline:none;border-color:var(--blue3);background:var(--bg2)}
.fnminp{border:1px solid var(--brd2);border-radius:7px;padding:8px 10px;font-size:13px;font-weight:500;background:var(--bg3);color:var(--tx);width:100%}
.fnminp:focus{outline:none;border-color:var(--blue3);background:var(--bg2)}
.conf-items{display:flex;flex-direction:column;gap:6px;margin:.75rem 0}
.conf-row{display:flex;align-items:center;gap:8px;cursor:pointer!important;padding:7px 10px;border-radius:var(--r);border:1px solid var(--brd);background:var(--bg3)}
.conf-row.on{background:var(--green2);border-color:var(--green3)}
.conf-box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--brd2);background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.conf-row.on .conf-box{background:var(--green2);border-color:var(--green3);color:#C6E8B0}
.conf-text{font-size:12px;color:var(--tx2)}
.exp-list{display:flex;flex-direction:column;gap:5px;max-height:240px;overflow-y:auto;margin:.75rem 0}
.exp-row{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--bg3);border-radius:var(--r);border:1px solid var(--brd);cursor:pointer!important}
.exp-row.on{background:var(--blue2);border-color:var(--blue3)}
.exp-chk{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--brd2);background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.exp-row.on .exp-chk{background:var(--blue);border-color:var(--blue3);color:#E6F1FB}
.toolbar{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap;align-items:center}
.sinp{flex:1;min-width:160px;border:1px solid var(--brd);border-radius:var(--r);padding:6px 10px;font-size:12px;background:var(--bg3);color:var(--tx2)}
.sinp:focus{outline:none;border-color:var(--blue3)}
.ssel{font-size:11px;border:1px solid var(--brd);border-radius:var(--r);padding:5px 8px;background:var(--bg3);color:var(--tx2);cursor:pointer}

  const riskCfg=getAlertCfg('risk');

  const e=c.phases[c.currentPhase]?.items?.find(i=>i.isEcd);
  const ed=e?.ecdDate?dU(e.ecdDate):null;
  const cd=dU(c.cad);
  if(riskOn&&ed!==null&&cd!==null&&ed<=riskDays)return'risk';
  if(c.currentPhase===0&&!c.phases[0].done)return'order';
  return'prog';
}
function sfpA(c){

    if(_riskCfg.enabled!==false&&_riskCfg.metric!==false)h+='<div class="mc" style="cursor:pointer;border-left:3px solid '+_riskCfg.color+'" onclick="filterRisk()" title="Click to filter"><div class="mc-top"><span class="mc-lbl">'+_riskCfg.label+'</span><div class="mc-ico" style="background:var(--amb2);color:var(--amb3)"><i class="ti ti-alert-triangle"></i></div></div><div class="mc-val">'+risky.length+'</div><div class="mc-sub" style="color:var(--blue3)">click to filter</div></div>';
    _allAlerts.filter(a=>a.metric&&a.id!=='urgent'&&a.id!=='risk'&&a.enabled!==false).forEach(al=>{h+='<div class="mc" style="border-left:3px solid '+(al.color||'#888')+'"><div class="mc-top"><span class="mc-lbl">'+al.label+'</span></div><div class="mc-val">--</div><div class="mc-sub">custom</div></div>';});
    h+='</div>';

      _cbox+='<div style="flex-shrink:0"><i class="ti ti-circle-check" style="color:var(--green3);font-size:14px"></i></div>';
      _cbox+='<div style="flex:1"><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--green3);margin-bottom:4px">Recently completed ('+completed.length+')</div>';
      _cbox+='<div style="display:flex;flex-wrap:wrap;gap:5px">';
      completed.slice(0,8).forEach(c=>{
        _cbox+='<span style="font-size:11px;background:var(--green2);border:1px solid var(--green3);border-radius:5px;padding:2px 8px;color:var(--blue3);cursor:pointer;font-weight:600" onclick="setTab(\'completed\')">'+(dn(c))+'</span>';
      });
      if(completed.length>8)_cbox+='<span style="font-size:11px;color:var(--green3);padding:2px 4px">+'+( completed.length-8)+' more</span>';
      _cbox+='</div></div>';
      _cbox+='<button class="btn btn-xs btn-ghost" onclick="setTab(\'completed\')" style="flex-shrink:0;font-size:10px">View all</button>';
      _cbox+='</div>';
      h+=_cbox;
    }
    
    
    h+=renderIF();
  } else if(ui.tab==='archive'){h+=renderArch();}
  else if(ui.tab==='completed'){h+=renderCompleted();}
  else if(ui.tab==='deleted'){h+=renderDel();}
  else if(ui.tab==='settings'){h+=renderSettings();}
  const _aEl=document.activeElement;
  const _fPh=_aEl&&_aEl.classList.contains('sinp')?_aEl.placeholder:null;
  const _ss=_aEl?_aEl.selectionStart:null;
  const _se=_aEl?_aEl.selectionEnd:null;
  app.innerHTML=h;
  if(_fPh){const _r=app.querySelector('.sinp[placeholder="'+_fPh+'"]');if(_r){_r.focus();try{_r.setSelectionRange(_ss,_se);}catch(e){}}}
}

function renderIF(){
  syncIL();
  let all=[...circuits];
  const q=(ui.ifSrch||'').toLowerCase();
  if(ui.ifSort==='cad')all.sort((a,b)=>(a.cad||'9999')>(b.cad||'9999')?1:-1);
  else if(ui.ifSort==='engineer')all.sort((a,b)=>(a.transportEngineer||'').localeCompare(b.transportEngineer||''));
  else if(ui.ifSort==='service')all.sort((a,b)=>(a.serviceType||'').localeCompare(b.serviceType||''));
  else if(ui.ifSort==='site')all.sort((a,b)=>(a.zEnd||'').localeCompare(b.zEnd||''));
  else if(ui.ifSort==='urgent')all.sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0));
  const _filter=ui.ifFilter||'';
  const fids=new Set(all.filter(c=>{
    if(_filter==='risk') return getSt(c)==='risk';
    if(_filter==='urgent') return c.urgent||c.priority>0;
    return !q||[c.name,c.circuitId,c.carrier,c.serviceType,c.aEnd,c.zEnd,c.transportEngineer].some(v=>(v||'').toLowerCase().includes(q));
  }).map(c=>c.id));
  const selCount=ui.selCards.size;
  let h='<div class="toolbar">';
  h+='<input class="sinp" placeholder="Search circuits..." value="'+(ui.ifSrch||'').replace(/"/g,'&quot;')+'" oninput="setIFS(this.value)" style="max-width:220px">';
  if(ui.ifFilter)h+='<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border-radius:20px;background:var(--amb2);color:var(--amb3);border:1px solid var(--amb3)"><i class="ti ti-filter"></i> '+(ui.ifFilter==='risk'?'At risk':'Urgent / Warning')+' <button onclick="clearFilter()" style="border:none;background:transparent;color:var(--amb3);cursor:pointer;font-size:12px;line-height:1;padding:0 0 0 3px">&times;</button></span>';
  h+='<select class="ssel" onchange="setIFGroup(this.value)"><option value="" '+(!ui.ifGroup?'selected':'')+'>No grouping</option><option value="engineer" '+(ui.ifGroup==='engineer'?'selected':'')+'>Group: Engineer</option><option value="service" '+(ui.ifGroup==='service'?'selected':'')+'>Group: Service</option><option value="site" '+(ui.ifGroup==='site'?'selected':'')+'>Group: Site</option><option value="urgent" '+(ui.ifGroup==='urgent'?'selected':'')+'>Group: Urgent</option><option value="pct" '+(ui.ifGroup==='pct'?'selected':'')+'>Group: % Progress</option><option value="carrier" '+(ui.ifGroup==='carrier'?'selected':'')+'>Group: Carrier</option><option value="protection" '+(ui.ifGroup==='protection'?'selected':'')+'>Group: Protection</option><option value="circuitid" '+(ui.ifGroup==='circuitid'?'selected':'')+'>Group: Circuit ID</option><option value="cad" '+(ui.ifGroup==='cad'?'selected':'')+'>Group: CAD</option><option value="cad_carrier" '+(ui.ifGroup==='cad_carrier'?'selected':'')+'>Group: CAD / Carrier</option></select>';
  if(selCount>0)h+='<button class="btn btn-sm btn-red" onclick="bulkDel()"><i class="ti ti-trash"></i> Delete selected ('+selCount+')</button>';
  const divSelCount=[...ui.selCards].filter(id=>id.startsWith('div-')).length;
  if(divSelCount>0)h+='<button class="btn btn-sm btn-red" onclick="bulkDelDivs()" title="Delete selected dividers"><i class="ti ti-trash"></i> Delete divider ('+divSelCount+')</button>';
  h+='</div>';
  if(selCount>0)h+='<div class="bulk-bar"><i class="ti ti-checkbox"></i><strong>'+selCount+'</strong> selected &nbsp;<button class="btn btn-sm btn-red" onclick="bulkDel()"><i class="ti ti-trash"></i> Delete selected</button><button class="btn btn-sm" onclick="bulkToQueue()"><i class="ti ti-arrow-back-up"></i> Send to Queue</button><button class="btn btn-sm btn-ghost" onclick="clearSel()">Clear</button></div>';
  if(!all.length)return h+'<div class="empty"><i class="ti ti-topology-star-3 empty-icon"></i>No circuits. Click <strong>New circuit</strong>.</div>';
  if(ui.ifGroup){
    // % grouping: bucket into 0-24, 25-49, 50-74, 75-99, 100
    if(ui.ifGroup==='pct'){
      const buckets={'0–24%':[],'25–49%':[],'50–74%':[],'75–99%':[],'100% Done':[]};
      all.filter(c=>fids.has(c.id)).forEach(c=>{
        const vph=visPh(c);const done=vph.filter(v=>v.ph.done).length;
        const pct=vph.length>0?Math.round((done/vph.length)*100):0;
        const bkt=pct===100?'100% Done':pct>=75?'75–99%':pct>=50?'50–74%':pct>=25?'25–49%':'0–24%';
        buckets[bkt].push(c);
      });
      Object.entries(buckets).forEach(([g,list])=>{if(!list.length)return;h+='<div class="grp-hdr"><i class="ti ti-chart-bar"></i>'+g+' <span class="nbadge">'+list.length+'</span></div>';list.forEach(c=>{h+=renderCard(c,false);});});
      return h;
    }
    // CAD grouping: sort by date, group by month
    if(ui.ifGroup==='cad'){
      const cadGroups={};
      all.filter(c=>fids.has(c.id)).sort((a,b)=>(a.cad||'9999')>(b.cad||'9999')?1:-1).forEach(c=>{
        const k=c.cad?new Date(c.cad+'T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}):'No CAD set';
        if(!cadGroups[k])cadGroups[k]=[];cadGroups[k].push(c);
      });
      Object.entries(cadGroups).forEach(([g,list])=>{h+='<div class="grp-hdr"><i class="ti ti-calendar"></i>'+g+' <span class="nbadge">'+list.length+'</span></div>';list.forEach(c=>{h+=renderCard(c,false);});});
      return h;
    }
    // CAD/Carrier grouping: group by CAD month, then sub-group by carrier
    if(ui.ifGroup==='cad_carrier'){
      const cadGroups={};
      all.filter(c=>fids.has(c.id)).sort((a,b)=>(a.cad||'9999')>(b.cad||'9999')?1:-1).forEach(c=>{
        const cadKey=c.cad?new Date(c.cad+'T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}):'No CAD set';
        if(!cadGroups[cadKey])cadGroups[cadKey]={};
        const carrKey=c.carrier||'Unknown carrier';
        if(!cadGroups[cadKey][carrKey])cadGroups[cadKey][carrKey]=[];
        cadGroups[cadKey][carrKey].push(c);
      });
      Object.entries(cadGroups).forEach(([cadG,carriers])=>{
        const totalInCad=Object.values(carriers).reduce((s,l)=>s+l.length,0);
        h+='<div class="grp-hdr"><i class="ti ti-calendar"></i>'+cadG+' <span class="nbadge">'+totalInCad+'</span></div>';
        Object.entries(carriers).sort(([a],[b])=>a.localeCompare(b)).forEach(([carrG,list])=>{
          h+='<div class="grp-hdr" style="margin-left:18px;font-size:11px;opacity:.85"><i class="ti ti-building-broadcast-tower"></i>'+carrG+' <span class="nbadge">'+list.length+'</span></div>';
          list.forEach(c=>{h+=renderCard(c,false);});
        });
      });
      return h;
    }
    const groups={};all.forEach(c=>{if(!fids.has(c.id))return;const k=ui.ifGroup==='engineer'?c.transportEngineer||'Unassigned':ui.ifGroup==='service'?c.serviceType||'Unknown':ui.ifGroup==='site'?c.zEnd||'Unknown site':ui.ifGroup==='carrier'?c.carrier||'Unknown carrier':ui.ifGroup==='protection'?c.protection||'Unprotected':ui.ifGroup==='circuitid'?c.circuitId||'No Circuit ID':c.urgent?'Urgent':'Normal';if(!groups[k])groups[k]=[];groups[k].push(c);});
    Object.entries(groups).forEach(([g,list])=>{h+='<div class="grp-hdr"><i class="ti ti-folder"></i>'+g+' <span class="nbadge">'+list.length+'</span></div>';list.forEach(c=>{h+=renderCard(c,false);});});return h;
  }
  h+='<div id="if-list" ondragover="listDO(event)" ondrop="listDrop(event)">';
  iList.forEach((item,idx)=>{
    if(item.type==='group'){
      const gdSel=ui.selCards.has('div-'+item.id);
      h+='<div class="gdiv '+(gdSel?'sel-c':'')+'" id="gd-'+item.id+'" draggable="true" ondragstart="gdDS(event,\''+item.id+'\','+idx+')" ondragend="gdDE(event)" ondragover="gdDOv(event,\''+item.id+'\','+idx+')" ondrop="gdDrop(event,\''+item.id+'\','+idx+')">';
      h+='<div class="cbwrap" onclick="togSelGD(\''+item.id+'\',event)" title="Select"><div class="chkbox '+(gdSel?'on':'')+'">'+(gdSel?'<i class="ti ti-check" style="font-size:9px;color:#E6F1FB"></i>':'')+'</div></div>';
      h+='<i class="ti ti-grip-vertical" style="color:var(--blue3);font-size:14px;flex-shrink:0;cursor:grab"></i>';
      h+='<i class="ti ti-separator" style="color:var(--blue3);font-size:15px;flex-shrink:0"></i>';
      h+='<input class="gdiv-inp" value="'+(item.label||'').replace(/"/g,'&quot;')+'" placeholder="Divider label..." oninput="renameGD(\''+item.id+'\',this.value)" onclick="event.stopPropagation()">';

      h+='</div>';
    } else {
      const c=circuits.find(x=>x.id===item.id);
      if(c&&fids.has(c.id))h+=renderCard(c,true,idx);
    }
  });
  h+='</div>';return h;
}

function renderCard(c,draggable,iIdx){

  const pill=st==='risk'?'<span class="spl sp-r"><span class="dot d-red"></span>At risk</span>':st==='order'?'<span class="spl sp-o"><span class="dot d-amb"></span>On order</span>':'<span class="spl sp-p"><span class="dot d-blue"></span>In progress</span>';
  const prot=c.protection==='Protected'?'<span class="prot-y">Protected</span>':'<span class="prot-n">Unprotected</span>';
  const dragA=draggable?'draggable="true" ondragstart="cgDS(event,\''+c.id+'\','+iIdx+')" ondragend="cgDE(event)" ondragover="cgDO(event,\''+c.id+'\')" ondrop="cgDrop(event,\''+c.id+'\','+iIdx+')"':'';
  let h='<div class="ccard '+(isOpen?'open ':'')+( c.urgent?'urg ':'')+( isSel?'sel-c ':'')+'" id="cc-'+c.id+'" '+dragA+'>';
  h+='<div class="ccard-top">';
  h+='<div class="cbwrap" onclick="togSel(\''+c.id+'\',event)" title="Select"><div class="chkbox '+(isSel?'on':'')+'">'+(isSel?'<i class="ti ti-check" style="font-size:9px;color:#E6F1FB"></i>':'')+'</div></div>';
  if(draggable)h+='<i class="ti ti-grip-vertical" style="color:var(--tx4);font-size:14px;cursor:grab;flex-shrink:0" onclick="event.stopPropagation()"></i>';
  const _nameBg=tmpl.displaySettings?.cardNameBg||'';
  const _urgCol=tmpl.displaySettings?.urgentColor||'';
  if(_urgCol&&c.urgent){h=h.replace('class="ccard urg','class="ccard urg" style="border-left-color:'+_urgCol+'"');}
  h+='<span class="ccard-name" onclick="toggleCard(\''+c.id+'\')" style="'+(  _nameBg&&_nameBg!=='#252E44'?'background:'+_nameBg+';padding:1px 6px;border-radius:4px;':'')+'">'+dn(c)+'</span>';
  h+='<div class="ccard-tr">';
  const _p=c.priority||0;
  const _pCls=_p===2?'urg-on':_p===1?'urg-warn':'urg-off';
  const _pLbl=_p===2?'&#128308; Urgent':_p===1?'&#128993; Warning':'&#128994; Normal';
  h+='<button class="urg-btn '+_pCls+'" onclick="togUrg(\''+c.id+'\')">'+_pLbl+'</button>';
  if(sfpA(c))h+='<span style="font-size:10px;color:var(--amb3);font-weight:600"><i class="ti ti-package"></i> SFP!</span>';
  h+=pill;
  
  h+='</div></div>';
  h+='<div class="ccard-meta" onclick="toggleCard(\''+c.id+'\')">';
  if(c.circuitId)h+='<span class="cid-chip">'+c.circuitId+'</span>';
  h+='<span class="tbadge">'+(c.serviceType||'--')+'</span>'+prot;
  h+='<span class="ccard-ep">'+(c.carrier||'--')+' &middot; '+(c.aEnd||'--')+' &rarr; '+(c.zEnd||'--')+'</span>';
  if(c.transportEngineer)h+='<span class="eng-chip"><i class="ti ti-user-bolt" style="font-size:9px"></i><span style="font-size:9px;opacity:.75;margin-right:2px">'+(tmpl.displaySettings?.engLabel||'TE')+'</span>'+c.transportEngineer+'</span>';
  // Progress % + pending phases always visible on card
  const _vph=visPh(c);
  const _done=_vph.filter(v=>v.ph.done).length;
  const _pct=_vph.length>0?Math.round((_done/_vph.length)*100):0;
  const _pctColor=_pct===100?'var(--green3)':_pct>=50?'var(--blue3)':_pct>0?'var(--amb3)':'var(--tx4)';
  // Build pending phases list
  const _pending=_vph.filter(v=>!v.ph.done&&!v.ph.skipped);
  let _pendH='';
  _pending.forEach(vp=>{
    const _ecd=vp.ph.items.find(i=>i.isEcd);
    const _ecdDate=_ecd&&_ecd.ecdDate?(_ecd.ecdDate.match(/^\d{4}-\d{2}-\d{2}$/)?fD(_ecd.ecdDate):_ecd.ecdDate):'';
    const _ecdCond=_ecd&&_ecd.ecdCond?_ecd.ecdCond:'';
    const _ecdVal=_ecdDate&&_ecdCond?_ecdDate+' · '+_ecdCond:_ecdDate||_ecdCond||'None';
    _pendH+='<div style="line-height:1.5;text-align:center;padding:1px 0">'
      +'<span style="font-size:11px;font-weight:600;color:var(--tx2)">'+vp.short+'</span> '
      +'<span style="font-size:10px;color:'+(_ecdDate?'var(--amb3)':_ecdCond?'var(--blue3)':'var(--tx4)')+'">'+_ecdVal+'</span>'

  h+='<div style="display:flex;align-items:flex-start;gap:8px;flex-shrink:0;margin-left:auto">';
  // Pending phases column — LEFT of percentage

  h+='<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;min-width:58px">';
  h+='<div style="font-size:16px;font-weight:700;color:'+_pctColor+'">'+_pct+'%</div>';
  h+='<div style="width:54px;height:6px;border-radius:3px;background:var(--bg4);overflow:hidden"><div style="height:100%;border-radius:3px;width:'+_pct+'%;background:'+_pctColor+';transition:width .3s"></div></div>';
  h+='<div style="font-size:9px;color:var(--tx4)">'+_done+'/'+_vph.length+' phases</div>';
  h+='</div>';
  h+='</div>';
  h+='<div class="cad-chip" style="margin-left:0"><div class="cad-l">CAD</div><div class="cad-v">'+(c.cad?fD(c.cad):'--')+'</div></div>';
  h+='</div>';
  // Pending phases row — full width strip below the meta row
  if(_pending.length>0){
    h+='<div style="padding:5px 13px 8px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;cursor:pointer;border-top:1px solid var(--brd)" onclick="toggleCard(\''+c.id+'\')">'; 
    h+='<span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);flex-shrink:0">'+(tmpl.displaySettings?.statusLabel||'Status')+'</span>';
    _pending.forEach(vp=>{
      const _ecd2=vp.ph.items.find(i=>i.isEcd);
      const _date2=_ecd2&&_ecd2.ecdDate?(_ecd2.ecdDate.match(/^\d{4}-\d{2}-\d{2}$/)?fD(_ecd2.ecdDate):_ecd2.ecdDate):'';
      const _cond2=_ecd2&&_ecd2.ecdCond?_ecd2.ecdCond:'';
      const _val2=_date2&&_cond2?_date2+' · '+_cond2:_date2||_cond2||'None';
      const _col2=_date2?'var(--amb3)':_cond2?'var(--blue3)':'var(--tx4)';
      h+='<span style="display:inline-flex;align-items:baseline;gap:4px">'
        +'<span style="font-size:11px;font-weight:600;color:var(--tx2)">'+vp.short+'</span>'
        +'<span style="font-size:10px;color:'+_col2+'">'+_val2+'</span>'
        +'</span>';
    });
    h+='</div>';
  }
  if(isOpen){
    const pTab=ui.phTab[c.id]??c.currentPhase;
    const iTab=ui.iTab[c.id]||'cl';
    h+='<div class="ccard-body">';
    h+=renderPL(c,pTab,'circuits');
    h+='<div class="itabs">';
    h+='<button class="itab '+(iTab==='cl'?'on':'')+'" onclick="setIT(\''+c.id+'\',\'cl\')">Checklist &amp; fields</button>';
    h+='<button class="itab '+(iTab==='hist'?'on':'')+'" onclick="setIT(\''+c.id+'\',\'hist\')">History</button>';
    h+='</div>';
    h+=iTab==='cl'?renderDetail(c,pTab,'circuits'):renderHist(c);
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function renderPL(c,pTab,src){
  const vph=visPh(c);
  const total=vph.length;
  const doneCount=vph.filter(vp=>vp.ph.done).length;
  const pct=total>0?Math.round((doneCount/total)*100):0;
  let h='<div class="pipeline">';
  // Big progress bar with 10% markers
  const fillCls=pct===100?'pl-fill-done':pct>0?'pl-fill-act':'pl-fill-pend';
  h+='<div class="pl-track" title="Overall progress: '+pct+'%">';
  for(let m=10;m<100;m+=10){h+='<div class="pl-mark" style="left:'+m+'%"></div>';}
  for(let m=20;m<100;m+=20){h+='<div class="pl-mark-lbl" style="left:calc('+m+'% + 3px)">'+m+'%</div>';}
  h+='<div class="pl-fill '+fillCls+'" style="width:'+Math.max(pct,2)+'%">';
  if(pct>9)h+=pct+'%';
  h+='</div></div>';
  // Phase pills row
  h+='<div class="pl-row">';
  vph.forEach(vp=>{
    const ph=vp.ph,isA=vp.idx===c.currentPhase&&!ph.done,isSel=vp.idx===pTab;
    const icoCls=ph.done?'pl-done-ico':ph.skipped?'pl-skip-ico':isA?'pl-act-ico':'pl-pend-ico';
    const lblCls=ph.done?'pl-done':ph.skipped?'pl-skip':isA?'pl-act':'';
    const ic=ph.done?'ti-check':ph.skipped?'ti-minus':isA?'ti-loader':'ti-circle';
    h+='<div style="display:flex;align-items:center;gap:4px;cursor:pointer;opacity:'+(isSel?'1':'.65')+';padding:2px 6px;border-radius:5px;background:'+(isSel?'var(--blue2)':'transparent')+';border:'+(isSel?'1px solid var(--blue3)':'1px solid transparent')+'" onclick="setPT(\''+c.id+'\','+vp.idx+',\''+src+'\')" title="'+ph.label+(ph.date?' ('+fD(ph.date)+')':'')+'">';
    h+='<div class="pl-icon '+icoCls+'"><i class="ti '+ic+'" style="font-size:9px"></i></div>';
    h+='<span class="pl-phase-lbl '+lblCls+'">'+vp.short+'</span>';
    if(ph.done&&ph.date)h+='<span style="font-size:8px;color:var(--tx4)">'+fD(ph.date)+'</span>';
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}

function renderDetail(c,pTab,src){
  const ph=c.phases[pTab],vph=visPh(c),isDark=c.isDark,isArch=src==='archive';
  let tH='<div class="dtabs">';
  vph.forEach(vp=>{const p=vp.ph,ac=vp.idx===pTab;tH+='<button class="dtab '+(ac?'on ':'')+( p.done?'dt-done ':p.skipped?'dt-skip ':'')+'" onclick="setPT(\''+c.id+'\','+vp.idx+',\''+src+'\')">'+(p.done?'&#10003; ':p.skipped?'-- ':'')+vp.short+'</button>';});
  tH+='</div>';
  const items=ph.items.filter(i=>!i.label.includes('dark fiber')||isDark);
  const done=items.filter(i=>i.done).length;
  let clH='';
  if(ph.skipped){
    clH='<div class="skip-note"><i class="ti ti-minus"></i> LOA &amp; XC skipped for dark fiber</div>';
  } else {
    clH='<div class="cl">';
    items.forEach(item=>{
      const ri=ph.items.indexOf(item);
      const lnks=(item.links||[]).map((l,li)=>'<div class="nlink"><i class="ti ti-link" style="font-size:10px;color:var(--tx4)"></i><a href="'+l.url+'" target="_blank" rel="noopener">'+( l.label||l.url)+'</a><button class="ico-btn" style="width:16px;height:16px" onclick="rmIL(\''+c.id+'\','+pTab+','+ri+','+li+',\''+src+'\')"><i class="ti ti-x" style="font-size:10px"></i></button></div>').join('');
      const ecdLabel=tmpl.ecdLabel||'Expected';
      const ecdR=item.isEcd?('<div class="ecd-row" style="flex-wrap:wrap;gap:4px">'
        +'<input class="ecd-d" type="text" value="'+(item.ecdDate||'').replace(/"/g,'&quot;')+'" placeholder="Date or text (e.g. Q3 2026)" data-cid="'+c.id+'" data-ph="'+pTab+'" data-idx="'+ri+'" data-f="ecdDate" data-src="'+src+'" onchange="updIF(this)" style="flex:1;min-width:120px">'
        +'<input type="date" style="width:34px;padding:2px;border:1px solid var(--brd);border-radius:5px;background:var(--bg2);cursor:pointer" title="Pick a date" onchange="setEcdFromPicker(this,\''+c.id+'\','+pTab+','+ri+',\''+src+'\')"> '
        +'<input class="ecd-c" type="text" value="'+(item.ecdCond||'').replace(/"/g,'&quot;')+'" placeholder="Conditions / phrase..." data-cid="'+c.id+'" data-ph="'+pTab+'" data-idx="'+ri+'" data-f="ecdCond" data-src="'+src+'" onchange="updIF(this)">'
        +'</div>'):'';
      clH+='<div class="ci" draggable="true" ondragstart="ciDS(event,\''+c.id+'\','+pTab+','+ri+',\''+src+'\')" ondragover="ciDO(event)" ondrop="ciDrop(event,\''+c.id+'\','+pTab+','+ri+',\''+src+'\')">';
      clH+='<div class="ci-chk '+(item.done?'on':'')+'" onclick="togCI(\''+c.id+'\','+pTab+','+ri+',\''+src+'\')">'+(item.done?'<i class="ti ti-check" style="font-size:9px"></i>':'')+'</div>';
      clH+='<i class="ti ti-grip-vertical" style="color:var(--tx4);font-size:11px;cursor:grab;flex-shrink:0;margin-top:3px"></i>';
      clH+='<div class="ci-r">';
      clH+='<div class="ci-lw"><input class="ci-li '+(item.done?'struck':'')+'" value="'+(item.isEcd?(tmpl.ecdLabel||'Expected'):item.label).replace(/"/g,'&quot;')+'" '+(item.isEcd?'disabled':'')+' data-cid="'+c.id+'" data-ph="'+pTab+'" data-idx="'+ri+'" data-src="'+src+'" onchange="renameCI(this)"><button class="ico-btn" style="width:16px;height:16px" onclick="rmCI(\''+c.id+'\','+pTab+','+ri+',\''+src+'\')" title="Remove"><i class="ti ti-x" style="font-size:10px"></i></button></div>';
      if(item.done&&item.date)clH+='<div class="ci-date"><i class="ti ti-check" style="font-size:9px"></i> '+fD(item.date)+'</div>';
      clH+=ecdR;
      if(lnks)clH+='<div class="note-links">'+lnks+'</div>';
      clH+='<input class="ci-note" placeholder="Note or paste URL..." value="'+(item.note||'').replace(/"/g,'&quot;')+'" data-cid="'+c.id+'" data-ph="'+pTab+'" data-idx="'+ri+'" data-src="'+src+'" onchange="hNote(this)">';
      clH+='</div></div>';
    });
    clH+='</div>';
    clH+='<button class="add-btn" onclick="addCI(\''+c.id+'\','+pTab+',\''+src+'\')"><i class="ti ti-plus" style="font-size:11px"></i> Add item</button>';
  }
  const phLinks=(ph.links||[]).map((l,li)=>'<div class="nlink"><i class="ti ti-link" style="font-size:10px;color:var(--tx4)"></i><a href="'+l.url+'" target="_blank" rel="noopener">'+(l.label||l.url)+'</a><button class="ico-btn" style="width:16px;height:16px" onclick="rmPL(\''+c.id+'\','+pTab+','+li+',\''+src+'\')"><i class="ti ti-x" style="font-size:10px"></i></button></div>').join('');
  const isLast=pTab===ALL_PH.length-1,phDone=ph.done;
  let footH='<div class="ph-foot"><span class="ph-prog"><strong>'+done+'</strong> / <strong>'+items.length+'</strong> done</span><div style="display:flex;gap:5px;flex-wrap:wrap">';
  if(ph.skipped){footH+='<span style="font-size:11px;color:var(--amb3)">Skipped (dark fiber)</span>';}
  else if(!isArch){
    footH+=phDone?'<button class="btn btn-sm" onclick="undoP(\''+c.id+'\','+pTab+')"><i class="ti ti-arrow-back-up"></i> Mark incomplete</button>':'<button class="btn btn-sm" style="opacity:.35" disabled><i class="ti ti-arrow-back-up"></i> Mark incomplete</button>';
    if(!phDone&&!isLast)footH+='<button class="btn btn-sm btn-blue" onclick="advPh(\''+c.id+'\','+pTab+')">Mark complete <i class="ti ti-chevron-right"></i></button>';
    else if(!phDone&&isLast)footH+='<button class="btn btn-sm btn-green" onclick="startConf(\''+c.id+'\')"><i class="ti ti-circle-check"></i> Mark live &amp; completed</button>';
  }
  if(isArch)footH+='<button class="btn btn-sm btn-blue" onclick="retIF(\''+c.id+'\')"><i class="ti ti-refresh"></i> Return to in-flight</button>';
  footH+='</div></div>';
  const phLblRow='<div style="display:flex;align-items:center;gap:6px;margin-bottom:9px"><input class="ptitle-inp" value="'+(ph.label||ALL_PH[pTab]?.label||'').replace(/"/g,'&quot;')+'" data-cid="'+c.id+'" data-ph="'+pTab+'" data-src="'+src+'" onchange="renamePhase(this)"><button class="btn btn-xs btn-ghost" onclick="openSaveTmpl()"><i class="ti ti-template"></i></button></div>';
  return tH+phLblRow+'<div class="two-col"><div><div class="panel"><div class="ptitle">Phase checklist</div>'+clH+'</div><div style="margin-top:9px"><div class="panel"><div class="ptitle">Phase notes</div>'+(phLinks?'<div class="note-links" style="margin-bottom:5px">'+phLinks+'</div>':'')+'<textarea class="na" placeholder="Notes -- paste URL for link..." data-cid="'+c.id+'" data-ph="'+pTab+'" data-src="'+src+'" onchange="hPhNote(this)">'+(ph.notes||'')+'</textarea></div></div>'+footH+'</div><div><div class="panel">'+renderFields(c,pTab,src)+'</div><div style="margin-top:9px"><div class="panel"><div class="ptitle">PM &amp; engineering contacts</div>'+renderContacts(c,src)+'</div></div></div></div>';
}

function renderHist(c){
  const h=[...(c.history||[])].reverse();
  if(!h.length)return'<div class="empty" style="padding:1rem"><i class="ti ti-history empty-icon" style="font-size:24px"></i>No history.</div>';
  return'<div class="hist-list">'+h.map(x=>'<div class="hist-item"><span class="hist-ts">'+fTs(x.ts)+'</span><span style="color:var(--tx2);line-height:1.4">'+x.msg+'</span></div>').join('')+'</div>';
}

function fld(lbl,fkey,flkey,val,cid,listId,src){
  src=src||'circuits';
  let h='<div class="fg"><div class="fl"><input class="fl-i" value="'+lbl.replace(/"/g,'&quot;')+'" data-cid="'+cid+'" data-flkey="'+flkey+'" data-src="'+src+'" onchange="renameField(this)" title="Rename">';
  h+='<button class="ico-btn" style="width:13px;height:13px" onclick="clrF(\''+cid+'\',\''+fkey+'\',\''+src+'\')" title="Clear"><i class="ti ti-eraser" style="font-size:9px"></i></button></div>';
  h+='<input class="fi" value="'+(val||'').replace(/"/g,'&quot;')+'" placeholder="--" data-cid="'+cid+'" data-field="'+fkey+'" data-src="'+src+'" '+(listId?'list="'+listId+'"':'')+' onchange="updF(this)">';
  if(listId)h+=dcOpts(listId);
  h+='</div>';
  return h;
}
function fr2(){return'<div class="fr">'+Array.from(arguments).join('')+'</div>';}

function renderFields(c,pTab,src){
  const k=ALL_PH[pTab].key,id=c.id;src=src||'circuits';
  const t=tmpl.fieldLabels||{},lb=(k,d)=>t[k]||d;
  if(k==='order')return'<div class="ptitle">Order details</div>'+fld(lb('name','Circuit name'),'name','name',c.name,id,'',src)+fld(lb('te','Transport engineer'),'transportEngineer','te',c.transportEngineer,id,'',src)+fld(lb('cid','Circuit ID'),'circuitId','cid',c.circuitId,id,'',src)+fld(lb('onum','Carrier order #'),'orderNum','onum',c.orderNum,id,'',src)+fr2(fld(lb('svc','Service type'),'serviceType','svc',c.serviceType,id,'',src),fld(lb('cap','Capacity'),'capacity','cap',c.capacity,id,'',src))+fld(lb('car','Carrier'),'carrier','car',c.carrier,id,'',src)+fr2(fld(lb('prot','Protection'),'protection','prot',c.protection,id,'',src),fld(lb('nrc','NRC'),'nrc','nrc',c.nrc,id,'',src))+fld(lb('cad','CAD'),'cad','cad',c.cad,id,'',src)+fld(lb('aend','A end'),'aEnd','aend',c.aEnd,id,'',src)+fld(lb('zend','Z end (data center)'),'zEnd','zend',c.zEnd,id,'dc-o-'+id,src);
  if(k==='osp')return'<div class="ptitle">OSP details</div>'+fld(lb('mmp','MMP / handhole / vault'),'ospMmp','mmp',c.ospMmp,id,'',src)+fld(lb('spl','Splice location'),'ospSplice','spl',c.ospSplice,id,'',src)+fld(lb('fib','Fiber type'),'ospFiber','fib',c.ospFiber,id,'',src)+(c.isDark?fld(lb('otdr','OTDR result'),'otdrResult','otdr',c.otdrResult,id,'',src)+fld(lb('otdrdt','OTDR PDF date'),'otdrDate','otdrdt',c.otdrDate,id,'',src):'');
  if(k==='cab_site')return'<div class="ptitle">Cab / site details</div>'+fr2(fld(lb('gend','Generator delivered'),'genDelivered','gend',c.genDelivered,id,'',src),fld(lb('ueta','Utility power ETA'),'utilityEta','ueta',c.utilityEta,id,'',src))+fld(lb('zend2','Z end (data center)'),'zEnd','zend2',c.zEnd,id,'dc-cs-'+id,src);
  if(k==='rack')return'<div class="ptitle">Rack &amp; stack</div>'+fld(lb('colo','Colo / data center'),'coloLocation','colo',c.coloLocation,id,'dc-r-'+id,src)+fld(lb('sfpt','SFP type'),'sfpType','sfpt',c.sfpType,id,'',src)+fr2(fld(lb('sfpo','SFP ordered date'),'sfpOrdered','sfpo',c.sfpOrdered,id,'',src),fld(lb('sfpd','SFP delivered'),'sfpDelivered','sfpd',c.sfpDelivered,id,'',src));
  if(k==='carrier_ttu')return'<div class="ptitle">Carrier TTU</div>'+fld(lb('ctd','Carrier turn-up date'),'turnupDate','ctd',c.turnupDate,id,'',src)+fr2(fld(lb('l1r','L1 test result'),'l1Result','l1r',c.l1Result,id,'',src),fld(lb('l1d','L1 test date'),'l1Date','l1d',c.l1Date,id,'',src))+(c.isDark?fld(lb('mopc','MOP (Carrier TTU)'),'mopCarrier','mopc',c.mopCarrier||'',id,'',src):'');
  if(k==='loa_xc')return'<div class="ptitle">LOA &amp; cross connect</div>'+fld(lb('loa','LOA received date'),'loaDate','loa',c.loaDate,id,'',src)+fld(lb('rp','Router port (Hotwire)'),'routerPort','rp',c.routerPort,id,'',src)+fld(lb('vlan','VLAN'),'vlan','vlan',c.vlan,id,'',src)+fld(lb('colo2','Colo / data center'),'coloLocation','colo2',c.coloLocation,id,'dc-l-'+id,src)+fr2(fld(lb('xco','XC order #'),'xcOrderNum','xco',c.xcOrderNum,id,'',src),fld(lb('xcc','XC confirmed date'),'xcConfirmed','xcc',c.xcConfirmed,id,'',src));
  if(k==='hwc_ttu')return'<div class="ptitle">HWC TTU</div>'+fld(lb('cpd','Completion notice date'),'completionDate','cpd',c.completionDate,id,'',src)+fld(lb('stu','SiteTracker updated'),'sitetrackerUpdated','stu',c.sitetrackerUpdated,id,'',src)+fld(lb('hws','HWC test sign-off'),'hwSignoff','hws',c.hwSignoff||'',id,'',src)+(c.isDark?fld(lb('moph','MOP (HWC TTU)'),'mopHwc','moph',c.mopHwc||'',id,'',src):'');
  return'';
}

function renderContacts(c,src){
  src=src||'circuits';
  const ci=(ph,fld,val)=>'<input class="ci2" placeholder="'+ph+'" value="'+(val||'').replace(/"/g,'&quot;')+'" data-cid="'+c.id+'" data-field="'+fld+'" data-src="'+src+'" onchange="updF(this)">';
  return'<div class="cg"><div class="cb-box"><div class="cb-lbl">Carrier PM &middot; '+(c.carrier||'carrier')+'</div>'+ci('Name','carrierPmName',c.carrierPmName)+ci('Phone','carrierPmPhone',c.carrierPmPhone)+ci('Email','carrierPmEmail',c.carrierPmEmail)+'</div><div class="cb-box"><div class="cb-lbl">Hotwire PM</div>'+ci('Name','hwPmName',c.hwPmName)+ci('Phone','hwPmPhone',c.hwPmPhone)+ci('Email','hwPmEmail',c.hwPmEmail)+'</div><div class="cb-box"><div class="cb-lbl">Hotwire Engineer</div>'+ci('Name','hwEngName',c.hwEngName)+'</div><div class="cb-box"><div class="cb-lbl">Transport Engineer</div>'+ci('Name','transportEngineer',c.transportEngineer)+'</div></div>';
}

function renderQueue(){
  const q=(ui.qSrch||'').toLowerCase();
  let list=queue.filter(c=>!q||[c.name,c.circuitId,c.carrier,c.serviceType,c.transportEngineer].some(v=>(v||'').toLowerCase().includes(q)));
  let h='<div class="toolbar"><input class="sinp" placeholder="Search queue..." value="'+(ui.qSrch||'').replace(/"/g,'&quot;')+'" oninput="setQS(this.value)" style="max-width:220px"></div>';
  if(!list.length)return h+'<div class="empty"><i class="ti ti-clock-pause empty-icon"></i>'+(queue.length===0?'No circuits in queue. Click <strong>New circuit</strong> to add one.':'No results.')+'</div>';
  list.forEach(c=>{
    const prot=c.protection==='Protected'?'<span class="prot-y">Protected</span>':'<span class="prot-n">Unprotected</span>';
    h+='<div class="acard" id="qc-'+c.id+'">';
    h+='<div class="acard-top">';
    h+='<span class="acard-name">'+dn(c)+'</span>';
    h+='<div style="display:flex;align-items:center;gap:5px"><span class="spl" style="background:var(--pur);color:var(--pur3)"><span class="dot" style="background:var(--pur3)"></span>In queue</span>'+(c.cad?'<span style="font-size:10px;color:var(--tx4)">CAD '+fD(c.cad)+'</span>':'')+'</div>';
    h+='</div>';
    h+='<div class="acard-meta">'
      +(c.circuitId?'<span class="cid-chip">'+c.circuitId+'</span>':'')
      +'<span class="tbadge">'+(c.serviceType||'--')+'</span>'+prot
      +'<span style="font-size:11px;color:var(--tx3)">'+(c.carrier||'--')+' &middot; '+(c.aEnd||'--')+' &rarr; '+(c.zEnd||'--')+'</span>'
      +(c.transportEngineer?'<span class="eng-chip"><i class="ti ti-user-bolt" style="font-size:9px"></i><span style="font-size:9px;opacity:.75;margin-right:2px">'+(tmpl.displaySettings?.engLabel||'TE')+'</span>'+c.transportEngineer+'</span>':'')
      +'<div class="cad-chip" style="margin-left:auto"><div class="cad-l">CAD</div><div class="cad-v">'+(c.cad?fD(c.cad):'--')+'</div></div>'
      +'</div>';
    h+='<div class="act-row">';
    h+='<button class="btn btn-sm btn-blue" onclick="queueToIF(\''+c.id+'\')"><i class="ti ti-player-play"></i> Move to In Flight</button>';
    h+='<button class="btn btn-sm btn-red" onclick="delFromQ(\''+c.id+'\')"><i class="ti ti-trash"></i> Delete</button>';
    h+='</div></div>';
  });
  return h;
}
function renderCompleted(){
  const q=(ui.compSrch||'').toLowerCase();
  let list=completed.filter(c=>!q||[c.name,c.circuitId,c.carrier,c.serviceType,c.aEnd,c.zEnd,c.transportEngineer].some(v=>(v||'').toLowerCase().includes(q)));
  let h='<div class="toolbar"><input class="sinp" placeholder="Search completed..." value="'+(ui.compSrch||'').replace(/"/g,'&quot;')+'" oninput="setCS(this.value)" style="max-width:220px"></div>';
  if(!list.length)return h+'<div class="empty"><i class="ti ti-circle-check empty-icon"></i>'+(completed.length===0?'No completed circuits yet. Circuits appear here after Mark live &amp; completed.':'No results.')+'</div>';
  list.forEach(c=>{
    const isSel=ui.compSel===c.id;
    const prot=c.protection==='Protected'?'<span class="prot-y">Protected</span>':'<span class="prot-n">Unprotected</span>';
    const _vph=visPh(c);const _done=_vph.filter(v=>v.ph.done).length;
    const _pct=_vph.length>0?Math.round((_done/_vph.length)*100):0;
    h+='<div class="acard">';
    h+='<div class="acard-top" onclick="togCS(\''+c.id+'\')">';
    h+='<span class="acard-name">'+dn(c)+'</span>';
    h+='<div style="display:flex;align-items:center;gap:6px">';
    h+='<span class="spl" style="background:var(--green2);color:var(--green3)"><span class="dot d-green"></span>Completed</span>';
    h+='<span style="font-size:11px;font-weight:700;color:var(--green3)">'+_pct+'%</span>';
    h+='<span style="font-size:10px;color:var(--tx4)">'+(c.completedAt?fD(c.completedAt.split('T')[0]):'--')+'</span>';
    h+='</div></div>';
    h+='<div class="acard-meta" onclick="togCS(\''+c.id+'\')">'
      +(c.circuitId?'<span class="cid-chip">'+c.circuitId+'</span>':'')
      +'<span class="tbadge">'+(c.serviceType||'--')+'</span>'+prot
      +'<span style="font-size:11px;color:var(--tx3)">'+(c.carrier||'--')+' &middot; '+(c.aEnd||'--')+' &rarr; '+(c.zEnd||'--')+'</span>'
      +(c.transportEngineer?'<span class="eng-chip"><i class="ti ti-user-bolt" style="font-size:9px"></i><span style="font-size:9px;opacity:.75;margin-right:2px">'+(tmpl.displaySettings?.engLabel||'TE')+'</span>'+c.transportEngineer+'</span>':'')
      +'</div>';
    if(isSel){
      const pTab=ui.compPh[c.id]??c.currentPhase;
      const iTab=ui.compIT[c.id]||'cl';
      h+='<div class="acard-det">'+renderPL(c,pTab,'completed')+'<div class="itabs"><button class="itab '+(iTab==='cl'?'on':'')+'" onclick="setCompIT(\''+c.id+'\',\'cl\')">Checklist &amp; fields</button><button class="itab '+(iTab==='hist'?'on':'')+'" onclick="setCompIT(\''+c.id+'\',\'hist\')">History</button></div>'+(iTab==='cl'?renderDetail(c,pTab,'completed'):renderHist(c))+'</div>';
    }
    h+='<div class="act-row">';
    h+='<button class="btn btn-sm btn-amb" onclick="compToArch(\''+c.id+'\')"><i class="ti ti-archive"></i> Move to Archive</button>';
    h+='<button class="btn btn-sm" onclick="compToIF(\''+c.id+'\')"><i class="ti ti-refresh"></i> Return to In Flight</button>';
    h+='<button class="btn btn-sm btn-red" onclick="softDelComp(\''+c.id+'\')"><i class="ti ti-trash"></i> Delete</button>';
    h+='</div></div>';
  });
  return h;
}
function renderArch(){
  const q=(ui.archSrch||'').toLowerCase();
  let list=archive.filter(c=>!q||[c.name,c.circuitId,c.carrier,c.serviceType,c.aEnd,c.zEnd,c.transportEngineer].some(v=>(v||'').toLowerCase().includes(q)));
  let h='<div class="toolbar"><input class="sinp" placeholder="Search archive..." value="'+(ui.archSrch||'').replace(/"/g,'&quot;')+'" oninput="setAS(this.value)"></div>';
  if(!list.length)return h+'<div class="empty"><i class="ti ti-archive empty-icon"></i>'+(archive.length===0?'No archived circuits.':'No results.')+'</div>';
  list.forEach(c=>{
    const isSel=ui.archSel===c.id,pTab=ui.archPh[c.id]??c.currentPhase,iTab=ui.archIT[c.id]||'cl';
    const prot=c.protection==='Protected'?'<span class="prot-y">Protected</span>':'<span class="prot-n">Unprotected</span>';
    h+='<div class="acard '+(c.urgent?'urg':'')+'">';
    h+='<div class="acard-top" onclick="togAS(\''+c.id+'\')">';
    h+='<span class="acard-name">'+dn(c)+'</span>';
    h+='<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">'+(c.priority===2?'<span class="urg-btn urg-on">&#128308; Urgent</span>':c.priority===1?'<span class="urg-btn urg-warn">&#128993; Warning</span>':(c.urgent?'<span class="urg-btn urg-on">&#128308; Urgent</span>':''))+'<span class="spl sp-l"><span class="dot d-green"></span>Archived</span><span style="font-size:10px;color:var(--tx4)">'+(c.archivedAt?fD(c.archivedAt.split('T')[0]):'--')+'</span></div>';
    h+='</div>';

function hashPass(p){
  // Simple deterministic hash (not cryptographic — suitable for local use)
  let h=0;for(let i=0;i<p.length;i++){h=(Math.imul(31,h)+p.charCodeAt(i))|0;}
  return h.toString(16);
}
const ADMIN_KEY='hwct_admin';
window.setAdminPass=()=>{
  const p1=document.getElementById('adm-pw1')?.value;
  const p2=document.getElementById('adm-pw2')?.value;
  if(!p1||p1.length<4){alert('Password must be at least 4 characters.');return;}
  if(p1!==p2){alert('Passwords do not match.');return;}
  sv(ADMIN_KEY,{hash:hashPass(p1)});
  ui.adminAuthed=true;
  showMsg('Admin password set. Settings are now protected.');renderApp();

window.changeAdminPass=()=>{

function renderHistoryLog(){
  const cats={circuit:'Circuit',settings:'Settings',admin:'Admin',system:'System'};
  const catColors={circuit:'var(--blue3)',settings:'var(--amb3)',admin:'var(--red3)',system:'var(--tx4)'};
  const fc=ui.histCat||'';
  const fs=(ui.histSrch||'').toLowerCase();
  let filtered=glog.filter(e=>{if(fc&&e.cat!==fc)return false;if(fs&&!e.msg.toLowerCase().includes(fs))return false;return true;});
  let h='<div class="ssec"><div class="stitle"><i class="ti ti-history"></i> Application history log <span style="font-size:10px;font-weight:400;color:var(--tx3)">— '+glog.length+' entries total</span></div>';
  h+='<div style="display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;align-items:center">';
  h+='<input class="sinp2" placeholder="Search log..." value="'+(ui.histSrch||'')+'" oninput="ui.histSrch=this.value;renderApp()" style="flex:1;min-width:150px">';
  h+='<select class="ssel2" onchange="ui.histCat=this.value;renderApp()"><option value="">All</option>';
  Object.entries(cats).forEach(([k,v])=>{h+='<option value="'+k+'" '+(fc===k?'selected':'')+'>'+v+'</option>';});
  h+='</select>';
    h+='<button class="btn btn-xs btn-ghost" onclick="clearGLog()"><i class="ti ti-trash"></i> Clear all</button>';
  h+='</div>';
  if(!filtered.length){h+='<div class="empty" style="padding:1rem"><span class="empty-icon" style="font-size:24px"><i class="ti ti-history"></i></span>'+(glog.length===0?'No history yet. Changes will appear here as you work.':'No results.')+'</div></div>';return h;}
  h+='<div style="display:flex;flex-direction:column;gap:3px;max-height:520px;overflow-y:auto">';
  filtered.forEach(e=>{
    const col=catColors[e.cat]||'var(--tx4)';
    const d=new Date(e.ts);
    const ds=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const ts=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    h+='<div style="display:flex;gap:8px;padding:5px 8px;background:var(--bg2);border-radius:5px;border:1px solid var(--brd);font-size:11px;align-items:flex-start">';
    h+='<span style="color:var(--tx4);white-space:nowrap;flex-shrink:0;min-width:148px;font-size:10px">'+ds+' '+ts+'</span>';
    h+='<span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:'+col+';flex-shrink:0;min-width:52px;padding-top:1px">'+(cats[e.cat]||e.cat)+'</span>';
    h+='<span style="color:var(--tx2);line-height:1.5;word-break:break-word">'+e.msg+'</span>';
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}

function getDefaultHelp(){return[
  {title:'Overview',items:[
    {q:'What is this tracker?',a:'The Hotwire Circuit Delivery Tracker manages circuits from order through turn-up across 7 phases: Order, OSP, Cab/Site, Rack & Stack, Carrier TTU, LOA/XC, HWC TTU. Dark fiber circuits skip LOA & XC automatically.'},

    {q:'What is the Expected date field?',a:'Each phase has an Expected date input at the top of its checklist. You can enter a date, a quarter (Q3 2026), or any text phrase. A small calendar icon lets you pick from a date picker. The label can be renamed in Settings > Display.'},

  {title:'Priority and status',items:[

    {q:'What is At Risk?',a:'A circuit is At Risk when its current phase Expected date is within the configured number of days of the CAD. Default is 30 days. You can change this in Settings > Alerts. Click the At Risk metric box to filter the list to only at-risk circuits.'}

function renderModal(){
  const r=document.getElementById('mroot');if(!r)return;
  if(ui.modal&&ui.mType==='new')r.innerHTML=renderNewForm();
  else if(ui.modal&&ui.mType==='exp')r.innerHTML=renderExpM();
  else if(ui.modal&&ui.mType==='bk')r.innerHTML=renderBkM();
  else if(ui.modal&&ui.mType==='rst')r.innerHTML=renderRstM();
  else if(ui.mType==='sbk')r.innerHTML=renderSBkM();
  else if(ui.mType==='srst')r.innerHTML=renderSRstM();
  else if(ui.confId)r.innerHTML=renderConf(ui.confId);
  else r.innerHTML='';
}

function renderNewForm(){
  const svc=(tmpl.dataSources?.serviceTypes||SVC_DEF).map(o=>'<option value="'+o+'">').join('');
  const car=(tmpl.dataSources?.carriers||CAR_DEF).map(o=>'<option value="'+o+'">').join('');
  const cap=(tmpl.dataSources?.capacities||CAP_DEF).map(o=>'<option value="'+o+'">').join('');
  const dc=(tmpl.dataSources?.dataCenters||DC_DEF).map(o=>'<option value="'+o+'">').join('');
  return'<div class="mov" onclick="if(event.target===this)closeM()"><div class="modal"><div class="modal-title">New circuit</div><div class="modal-sub">Name is your primary identifier. ECD tracked per phase checklist.</div><div style="margin-bottom:9px"><label class="flbl">Circuit name <span style="color:var(--red3)">*</span></label><input class="fnminp" id="nf-name" placeholder="e.g. Acme Corp -- Miami to Atlanta"></div><div class="fg2"><div class="full"><label class="flbl">Transport engineer</label><input class="finp" id="nf-eng" placeholder="Engineer name"></div><div><label class="flbl">Circuit ID</label><input class="finp" id="nf-cid" placeholder="CKT-HW-0441"></div><div><label class="flbl">Service type</label><input class="finp" id="nf-svc" list="s-svc" placeholder="ELAN, EPL, DIA..."><datalist id="s-svc">'+svc+'</datalist></div><div><label class="flbl">Carrier</label><input class="finp" id="nf-car" list="s-car" placeholder="Lumen, AT&T..."><datalist id="s-car">'+car+'</datalist></div><div><label class="flbl">Capacity</label><input class="finp" id="nf-cap" list="s-cap" placeholder="1G, 10G..."><datalist id="s-cap">'+cap+'</datalist></div><div><label class="flbl">Protection</label><input class="finp" id="nf-prot" list="s-prot" placeholder="Protected / Unprotected"><datalist id="s-prot"><option value="Protected"><option value="Unprotected"></datalist></div><div><label class="flbl">CAD</label><input class="finp" id="nf-cad" type="date"></div><div><label class="flbl">A end</label><input class="finp" id="nf-aend" placeholder="Location / POP"></div><div class="full"><label class="flbl">Z end (data center)</label><input class="finp" id="nf-zend" list="s-dc" placeholder="Select or type..."><datalist id="s-dc">'+dc+'</datalist></div></div><div class="modal-foot"><button class="btn" onclick="closeM()">Cancel</button><button class="btn btn-blue" onclick="createC()"><i class="ti ti-plus"></i> Create</button></div></div></div>';

function renderConf(cid){
  const c=circuits.find(x=>x.id===cid);if(!c)return'';
  const allOn=CONF_ITEMS.every((_,i)=>ui.cc[i]);
  let h='<div class="mov" onclick="if(event.target===this)closeM()"><div class="modal"><div class="modal-title"><i class="ti ti-circle-check" style="color:var(--green3);margin-right:4px"></i>Mark as live</div><div class="modal-sub"><strong>'+dn(c)+'</strong> &middot; '+(c.serviceType||'--')+' &middot; '+(c.carrier||'--')+'</div><div class="conf-items">';
  CONF_ITEMS.forEach((t,i)=>{h+='<div class="conf-row '+(ui.cc[i]?'on':'')+'" onclick="togCC('+i+')"><div class="conf-box">'+(ui.cc[i]?'<i class="ti ti-check" style="font-size:9px;color:#C6E8B0"></i>':'')+'</div><span class="conf-text">'+t+'</span></div>';});
  h+='</div><div class="modal-foot"><button class="btn" onclick="closeM()">Cancel</button><button class="btn btn-green '+(allOn?'':'btn-dis')+'" onclick="archC(\''+cid+'\')"><i class="ti ti-archive"></i> Confirm &amp; archive</button></div></div></div>';
  return h;
}

  const src=ui.expTgt||ui.tab;
  const list=src==='inflight'?circuits:src==='archive'?archive:deleted;
  let h='<div class="mov" onclick="if(event.target===this)closeM()"><div class="modal"><div class="modal-title">Export -- '+(src==='inflight'?'In flight':src==='archive'?'Archive':'Deleted')+'</div><div class="modal-sub">Select circuits, then choose Word or PDF.</div><div style="display:flex;gap:6px;margin-bottom:5px"><button class="btn btn-xs" onclick="selAllE(\''+src+'\',true)">All</button><button class="btn btn-xs" onclick="selAllE(\''+src+'\',false)">None</button></div><div class="exp-list">';
  list.forEach(c=>{h+='<div class="exp-row '+(ui.expSel[c.id]?'on':'')+'" onclick="togES(\''+c.id+'\')"><div class="exp-chk">'+(ui.expSel[c.id]?'<i class="ti ti-check" style="font-size:9px;color:#E6F1FB"></i>':'')+'</div><span style="font-size:12px;color:var(--tx2)">'+dn(c)+'</span><span class="tbadge" style="margin-left:auto">'+(c.serviceType||'--')+'</span>'+(c.urgent?'<span class="urg-btn urg-on" style="font-size:9px">Urgent</span>':'')+'</div>';});
  h+='</div><div class="modal-foot"><button class="btn" onclick="closeM()">Cancel</button><button class="btn btn-amb" onclick="doWord(\''+src+'\')"><i class="ti ti-file-word"></i> Word</button><button class="btn btn-blue" onclick="doPDF()"><i class="ti ti-printer"></i> PDF</button></div></div></div>';

function buildWord(list,today,src){
  const rows=list.filter(c=>ui.expSel[c.id]);
  if(!rows.length)return null;
  const ws=tmpl.wordSettings||{};
  const ac=ws.accentColor||'#1B3F6E';
  const co=ws.companyName||'Hotwire Communications';
  const sep=(lbl,val)=>'<div style="padding:2px 0;border-bottom:1px solid #E8E8E8;font-size:9pt;line-height:1.6"><span style="color:#555;min-width:140px;display:inline-block;font-weight:500">'+lbl+'</span><span style="color:#111">'+(val||'--')+'</span></div>';
  const hdr=(txt,col)=>'<div style="color:'+(col||ac)+';font-weight:bold;font-size:9pt;margin:7px 0 3px;border-bottom:1.5px solid '+(col||ac)+';padding-bottom:2px">'+txt+'</div>';
  const srcLabel=src==='inflight'?'In-Flight':src==='archive'?'Archived':'Deleted';
  const sections=rows.map((c,i)=>{
    const st=getSt(c);
    const badge=c.urgent?'#C0392B':st==='risk'?'#E87722':st==='order'?'#F0A500':'#2A7A2A';
    const stLabel=c.priority===2||c.urgent?'URGENT':c.priority===1?'WARNING':st==='risk'?'AT RISK':st==='order'?'ON ORDER':'IN PROGRESS';
    const ecdI=c.phases[c.currentPhase]?.items?.find(x=>x.isEcd);
    const ecd=ecdI?.ecdDate?fD(ecdI.ecdDate):'--';
    const ecdCond=ecdI?.ecdCond||'';
    const phDone=c.phases.filter(p=>p.done).length;
    const phTotal=visPh(c).length;
    let content='<div style="background:'+ac+';color:#FFF;padding:6px 10px;border-radius:2px 2px 0 0;display:flex;justify-content:space-between;align-items:center"><span style="font-size:10pt;font-weight:bold">'+(i+1)+'. '+dn(c)+'</span>'+(ws.showStatus!==false?'<span style="font-size:8pt;background:'+badge+';color:#fff;padding:2px 8px;border-radius:8px">'+stLabel+'</span>':'')+'</div>';
    content+='<div style="border:1px solid #BBBBBB;border-top:none;padding:8px 10px;border-radius:0 0 2px 2px">';
    if(ws.showPhase!==false){content+=hdr('Status & progress',ac);content+=sep('Current phase',ALL_PH[c.currentPhase]?.label||'--');content+=sep('Phase progress',phDone+' of '+phTotal+' complete');content+=sep('Next pending',getNext(c));content+=sep('Last completed',getLast(c));}
    if(ws.showDates!==false){content+=hdr('Key dates',ac);content+=sep('CAD',fD(c.cad));content+=sep('ECD (current phase)',ecd+(ecdCond?' -- '+ecdCond:''));content+=sep('Circuit ID',c.circuitId);content+=sep('Service type',(c.serviceType||'--')+' - '+(c.capacity||'--'));content+=sep('Carrier',c.carrier);content+=sep('Protection',c.protection);content+=sep('A end',c.aEnd);content+=sep('Z end / Site',c.zEnd);}
    if(ws.showTeam!==false){content+=hdr('Team',ac);content+=sep('Transport engineer',c.transportEngineer);content+=sep('Hotwire engineer',c.hwEngName);}
    if(ws.showContacts!==false){content+=sep('Carrier PM',(c.carrierPmName||'--')+(c.carrierPmPhone?' - '+c.carrierPmPhone:''));content+=sep('Hotwire PM',(c.hwPmName||'--')+(c.hwPmPhone?' - '+c.hwPmPhone:''));}
    if(ws.showTechnical!==false){content+=hdr('Technical',ac);content+=sep('Colo / data center',c.coloLocation);content+=sep('SFP type',c.sfpType);content+=sep('Router port',c.routerPort);content+=sep('VLAN',c.vlan);content+=sep('L1 result',c.l1Result);if(c.isDark){content+=sep('MOP - Carrier TTU',c.mopCarrier);content+=sep('MOP - HWC TTU',c.mopHwc);}}
    if(ws.showNotes){const notes=c.phases.map((ph,idx)=>ph.notes?ALL_PH[idx]?.label+': '+ph.notes:'').filter(Boolean).join(' | ');if(notes){content+=hdr('Notes',ac);content+=sep('Phase notes',notes);}}
    (ws.customSections||[]).forEach(sec=>{if(sec.title&&sec.content){content+=hdr(sec.title,ac)+sep(sec.content,'');}});
    content+='</div>';
    return'<div style="margin-bottom:14px;page-break-inside:avoid">'+content+'</div>';
  }).join('');
  return'<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif;font-size:9pt;margin:.7in .75in}h1{font-size:13pt;color:'+ac+';margin-bottom:2px}@page{margin:.7in .75in;size:letter}</style></head><body><h1>'+co+' -- '+srcLabel+' Circuit Status Report</h1><div style="font-size:8pt;color:#666;margin-bottom:10px">Generated: '+today+' | Circuits: '+rows.length+' | Urgent: '+rows.filter(c=>c.urgent).length+' | At risk: '+rows.filter(c=>getSt(c)==='risk').length+'</div>'+sections+'</body></html>';
}

  if(!file){alert('Select a settings backup file.');return;}
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.version||!d.version.includes('settings')){
        if(!confirm('This file may not be a settings backup. Apply anyway?'))return;
      }
      if(!confirm('Restore settings from backup "'+( d.name||'unknown')+'"?\n\nThis will overwrite your current template, display, word doc, alerts, and preference settings.\n\nCircuit data is NOT affected.'))return;
      if(d.template){
        // Merge carefully - preserve circuit data references
        tmpl=d.template;
        sv(TK,tmpl);
      }
      if(d.prefs){
        prefs=d.prefs;
        sv(PK,prefs);
      }
      sv('hwct9_stssave',{ts:new Date().toISOString()});
      gLog('settings','Settings restored from backup: '+(d.name||'unknown')+' (exported '+( d.exportedAt?fTs(d.exportedAt):'unknown')+')');
      applyColors();applyZoom();
      closeM();showMsg('Settings restored from backup.');renderApp();
    }catch(err){alert('Invalid settings file: '+err.message);}
  };
  r.readAsText(file);
};

window.clearGLog=()=>{if(!confirm('Clear all history? This cannot be undone.'))return;glog=[];sv(GLK,glog);renderApp();};

window.resetWordSettings=()=>{
  if(!confirm('Reset all Word document settings to defaults?\nThis includes company name, accent color, and all section toggles.'))return;
  const def=defTmpl();
  tmpl.wordSettings={...def.wordSettings};
  // Clear custom sections too
  if(!confirm('Also clear custom sections added to the Word doc?')){
    // keep custom sections
  } else {
    tmpl.wordSettings.customSections=[];
  }
  sv(TK,tmpl);
  gLog('settings','Word doc settings reset to defaults');
  showMsg('Word doc settings reset to defaults.');
  renderApp();
};

window.resetDisplaySettings=()=>{
  if(!confirm('Reset all display preferences to defaults?\nThis includes tracker name, colors, font size, sort and group settings.'))return;
  const def=defTmpl();
  tmpl.displaySettings={...def.displaySettings};
  // Reset color overrides
  delete tmpl.displaySettings.cardNameBg;
  delete tmpl.displaySettings.engChipBg;
  delete tmpl.displaySettings.normalColor;
  delete tmpl.displaySettings.urgentColor;
  delete tmpl.displaySettings.warningColor;
  delete tmpl.displaySettings.urgentBorder;
  delete tmpl.displaySettings.engLabel;
  delete tmpl.displaySettings.trackerName;
  delete tmpl.displaySettings.statusLabel;
  delete tmpl.ecdLabel;
  sv(TK,tmpl);
  ui.ifSort=def.displaySettings.defaultSort||'cad';
  ui.ifGroup=def.displaySettings.defaultGroup||'';
  applyColors();
  gLog('settings','Display settings reset to defaults');
  showMsg('Display settings reset to defaults.');
  renderApp();
};

window.resetDataSources=()=>{
  if(!confirm('Reset all data source lists to factory defaults?\nService types, carriers, data centers, and capacities will be restored.'))return;
  tmpl.dataSources={serviceTypes:[...SVC_DEF],carriers:[...CAR_DEF],dataCenters:[...DC_DEF],capacities:[...CAP_DEF]};
  sv(TK,tmpl);
  gLog('settings','Data sources reset to factory defaults');
  showMsg('Data sources reset to defaults.');
  renderApp();
};
window.updEcdLabel=v=>{tmpl.ecdLabel=v||'Expected';sv(TK,tmpl);renderApp();};
window.resetClr=(key,def)=>{ui.settingsDirty=true;
  if(!tmpl.displaySettings)tmpl.displaySettings={};
  tmpl.displaySettings[key]=def;
  sv(TK,tmpl);
  const el=document.getElementById('clr-'+key);
  if(el)el.value=def;
  applyColors();renderApp();
};
window.uploadLogo=function(input){
  var file=input.files&&input.files[0];
  if(!file)return;
  if(file.size>500000){alert('Image too large. Please use an image under 500KB.');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    if(!tmpl.displaySettings)tmpl.displaySettings={};
    tmpl.displaySettings.logoImg=e.target.result;
    sv(TK,tmpl);
    showMsg('Logo uploaded.');
    renderApp();
  };
  reader.readAsDataURL(file);
};
window.removeLogo=function(){
  if(!confirm('Remove logo and restore the default icon?'))return;
  if(tmpl.displaySettings)delete tmpl.displaySettings.logoImg;
  sv(TK,tmpl);
  showMsg('Logo removed.');
  renderApp();
};
window.updFontSize=v=>{
  const px=Math.min(15,Math.max(11,parseInt(v)||13));
  prefs.fontSize=px;
  document.documentElement.style.setProperty('--base-font',px+'px');
  ui.settingsDirty=true;
  renderApp();
};
window.addSrc=key=>{const el=document.getElementById('src-'+key);if(!el||!el.value.trim())return;if(!tmpl.dataSources)tmpl.dataSources={};if(!tmpl.dataSources[key])tmpl.dataSources[key]=[];tmpl.dataSources[key].push(el.value.trim());el.value='';ui.settingsDirty=true;renderApp();};
window.rmSrc=(key,i)=>{if(!tmpl.dataSources?.[key])return;const val=tmpl.dataSources[key][i];if(!confirm('Remove "'+val+'" from the list?'))return;tmpl.dataSources[key].splice(i,1);ui.settingsDirty=true;renderApp();};
window.updCustPh=el=>{const i=+el.dataset.phidx;if(!tmpl.customPhases)tmpl.customPhases=ALL_PH.map(p=>({key:p.key,label:tmpl.phLabels[p.key]||p.label,isDefault:true}));tmpl.customPhases[i].label=el.value;ui.settingsDirty=true;};
window.rmCustPh=i=>{if(!tmpl.customPhases)return;const ph=tmpl.customPhases[i];if(ph.isDefault){alert('Default phases cannot be removed, only renamed.');return;}if(!confirm('Remove phase "'+ph.label+'"? This will delete its checklist data from all circuits.'))return;tmpl.customPhases.splice(i,1);tmpl.cl[ph.key]=undefined;circuits.forEach(c=>{c.phases=c.phases.filter(p=>p.key!==ph.key);});sv(SK,circuits);renderApp();};
window.addCustPh=()=>{const name=document.getElementById('new-ph-name')?.value?.trim();const key=document.getElementById('new-ph-key')?.value?.trim().replace(/\s+/g,'_');if(!name||!key){alert('Please enter both a phase name and a key.');return;}if(ALL_PH.find(p=>p.key===key)||(tmpl.customPhases||[]).find(p=>p.key===key)){alert('That key already exists. Use a unique key.');return;}if(!tmpl.customPhases)tmpl.customPhases=ALL_PH.map(p=>({key:p.key,label:tmpl.phLabels[p.key]||p.label,isDefault:true}));tmpl.customPhases.push({key,label:name,isDefault:false});if(!tmpl.cl[key])tmpl.cl[key]=[];circuits.forEach(c=>{if(!c.phases.find(p=>p.key===key))c.phases.push(mkPhase(key,c.isDark));});sv(SK,circuits);renderApp();};
window.resetPhases=()=>{if(!confirm('Reset all phase names to defaults?'))return;tmpl.customPhases=ALL_PH.map(p=>({key:p.key,label:p.label,isDefault:true}));tmpl.phLabels={};circuits.forEach(c=>{c.phases.forEach((ph,i)=>{const def=ALL_PH[i];if(def)ph.label=def.label;});addH(c,'Phase names reset to defaults');});sv(SK,circuits);sv(TK,tmpl);showMsg('Phases reset to defaults.');renderApp();};
window.saveCustPhases=()=>{if(!tmpl.customPhases)tmpl.customPhases=ALL_PH.map(p=>({key:p.key,label:tmpl.phLabels[p.key]||p.label,isDefault:true}));tmpl.customPhases.forEach(ph=>{tmpl.phLabels[ph.key]=ph.label;});circuits.forEach(c=>{c.phases.forEach((ph,i)=>{const custPh=tmpl.customPhases.find(x=>x.key===ph.key);if(custPh)ph.label=custPh.label;});addH(c,'Phase labels updated from settings');});sv(SK,circuits);sv(TK,tmpl);showMsg('Phase names saved and applied to all circuits.');renderApp();};
window.saveTmpl=()=>{sv(TK,tmpl);sv('hwct9_stssave',{ts:new Date().toISOString()});ui.settingsDirty=false;gLog('settings','Template saved and applied to all circuits');circuits.forEach(c=>{ALL_PH.forEach((phDef,phIdx)=>{const ph=c.phases[phIdx];if(tmpl.phLabels[phDef.key])ph.label=tmpl.phLabels[phDef.key];const ex=new Set(ph.items.map(i=>i.label));(tmpl.cl[phDef.key]||[]).forEach(l=>{if(!ex.has(l)&&(!l.includes('dark fiber')||c.isDark)){ph.items.push(mkItem(l));ex.add(l);}});});addH(c,'Template applied');});sv(SK,circuits);ui.pendTmpl=false;showMsg('Template saved and applied to all circuits.');renderApp();};

ui.multiOpen=prefs.multiOpen===true;
syncIL();applyZoom();applyColors();setupAutoBackup();checkDailyBackup();gLog('system','App loaded. '+circuits.length+' in flight, '+queue.length+' in queue, '+completed.length+' completed.');render();
</script>
</body>
